<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    </meta>
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    </meta>
    <meta name="description"
        content="Gem Cracker - chip away at a stone solid with a hammer to uncover the gems hidden inside.">
    </meta>
    <meta name="theme-color" content="#14110e">
    </meta>
    <meta name="color-scheme" content="dark">
    </meta>
    <meta name="format-detection" content="telephone=no">
    </meta>
    <meta name="mobile-web-app-capable" content="yes">
    </meta>
    <meta name="apple-mobile-web-app-capable" content="yes">
    </meta>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    </meta>
    <meta name="apple-mobile-web-app-title" content="Gem Cracker">
    </meta>
    <title>Gem Cracker</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    </link>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
    </link>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
    </link>
        <link rel="stylesheet" href="style.css">

</head>

<body>
    <div id="loader" data-screen-label="Loading">
        <div class="brand">Gem Cracker</div>
        <div class="dots"><i></i><i></i><i></i></div>
        <div class="label">Loading</div>
    </div>

    <div id="stage" data-screen-label="Gem Cracker">
        <div id="game-container"></div>
    </div>
    <div id="vignette"></div>
    <div id="star-glow"></div>

    <button id="level-select-btn" class="level-select-btn" aria-label="Select level"><span
            id="level-select-label">LEVELS</span></button>

    <div id="level-overlay" class="modal-overlay">
        <div class="options-card" style="width: calc(100% - 32px); max-width: 680px;">
            <h2 id="level-title">SELECT LEVEL</h2>
            <div id="level-list"
                style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; width: 100%; max-height: 62vh; overflow-y: auto; overflow-x: hidden;">
            </div>
            <button id="level-close" class="options-close-btn">CLOSE</button>
        </div>
    </div>

    <button id="options-btn" class="options-btn" aria-label="Settings">⚙</button>

    <div id="options-overlay">
        <div class="options-card">
            <h2 id="settings-title">SETTINGS</h2>

            <div class="option-row">
                <label id="sfx-label">SFX VOLUME</label>
                <div class="slider-container">
                    <input type="range" id="sfx-volume" min="0" max="100" value="100">
                    <span id="sfx-val">100%</span>
                </div>
            </div>

            <div class="option-row">
                <label id="music-label">MUSIC VOLUME</label>
                <div class="slider-container">
                    <input type="range" id="music-volume" min="0" max="100" value="50">
                    <span id="music-val">50%</span>
                </div>
            </div>

            <div class="option-row" id="shake-row">
                <label id="shake-label" for="shake-toggle">SCREEN SHAKE</label>
                <div class="option-toggle-container">
                    <input type="checkbox" id="shake-toggle" class="option-checkbox" checked>
                    <span id="shake-status" class="option-status-text">ON</span>
                </div>
            </div>

            <div class="option-row" id="haptics-row" style="display: none;">
                <label id="haptics-label" for="haptics-toggle">HAPTICS</label>
                <div class="option-toggle-container">
                    <input type="checkbox" id="haptics-toggle" class="option-checkbox" checked>
                    <span id="haptics-status" class="option-status-text">ON</span>
                </div>
            </div>

            <div class="option-row">
                <label id="lang-label">LANGUAGE</label>
                <select id="lang-select" class="lang-select">
                    <option value="en">English</option>
                    <option value="es">Español</option>
                    <option value="fr">Français</option>
                    <option value="zh">简体中文</option>
                    <option value="zh-hant">繁體中文</option>
                    <option value="ar">العربية</option>
                    <option value="hi">हिन्दी</option>
                    <option value="ja">日本語</option>
                    <option value="ru">Русский</option>
                </select>
            </div>

            <button id="settings-close" class="options-close-btn">CLOSE</button>
        </div>
    </div>

    <div id="hud">
        <div id="top">
            <h1>Gem Cracker</h1>
            <div class="slots">
                <div class="slot-wrap">
                    <div class="slot"></div>
                    <div class="ring"></div>
                </div>
                <div class="slot-wrap">
                    <div class="slot"></div>
                    <div class="ring"></div>
                </div>
                <div class="slot-wrap">
                    <div class="slot"></div>
                    <div class="ring"></div>
                </div>
                <div id="ring-badge" aria-hidden="true">◎</div>
            </div>
            <div id="level-strikes" class="is-zero" aria-live="polite" aria-label="Level strikes">
                <span id="level-strikes-label">STRIKES:</span>
                <strong id="level-strikes-count">0</strong>
            </div>
        </div>
        <div id="bottom">
            <!-- Keep the instruction immediately above the thumb controls. -->
            <div id="hint" data-text=""></div>
            <div id="tool-bar">
                <button type="button" id="tool-hammer" class="tool-btn active" aria-label="Hammer">🔨</button>
                <div style="position: relative;">
                    <button type="button" id="tool-scan" class="tool-btn hidden" aria-label="Gem detector">🔍</button>
                    <div id="new-tool-tooltip">NEW TOOL!</div>
                </div>
                <div style="position: relative;">
                    <button type="button" id="tool-bomb" class="tool-btn hidden" aria-label="Explosive charge">💥</button>
                    <div id="new-tool-tooltip-bomb">NEW TOOL!</div>
                </div>
            </div>
        </div>
    </div>

    <div id="tool-toast" class="tool-toast"></div>

    <div id="overlay" data-screen-label="Win overlay">
        <div class="card" id="winCard">
            <h2 id="winTitle">CUBE CRACKED</h2>
            <p id="winDesc">all gems claimed in <span id="strikeCount">0</span> strikes</p>
            <div id="winStars" class="win-stars" aria-hidden="true">
                <span class="win-star">★</span><span class="win-star">★</span><span class="win-star">★</span>
            </div>
            <p id="winRank" aria-live="polite"></p>
            <p id="winBest" style="font-family: monospace; font-size: 24px; letter-spacing: 0.08em; min-height: 28px;"></p>
            <p id="winRing" style="font-family: monospace; font-size: 24px; letter-spacing: 0.08em; min-height: 28px; color: #ffd166;"></p>
            <button id="again">NEXT TRIAL</button>
        </div>
        <div class="card" id="endCard"
            style="display: none; width: 100%; max-width: 480px; padding: 30px; background: linear-gradient(135deg, #221d18 0%, #14110e 100%); border: 2px solid rgba(232, 201, 138, 0.3); border-radius: 12px; box-shadow: 0 15px 45px rgba(0, 0, 0, 0.7); text-align: center; flex-direction: column; gap: 24px; margin: auto;">
            <h2 id="endTitle" style="font-size: 32px; color: var(--gold); letter-spacing: 0.15em;">CHAMPIONSHIP COMPLETE
            </h2>
            <p id="endSubtitle"
                style="font-size: 24px; color: var(--gold); letter-spacing: 0.08em; text-transform: uppercase;">GAME
                SCOREBOARD
            </p>
            <div id="levelStats" style="display: flex; flex-direction: column; gap: 12px; width: 100%;">
                <!-- Level score lines will be injected here -->
            </div>
            <div id="totalStats"
                style="font-size: 26px; color: var(--gold); font-weight: bold; letter-spacing: 0.05em; border-top: 1px solid rgba(232, 201, 138, 0.15); border-bottom: 1px solid rgba(232, 201, 138, 0.15); padding: 12px 0;">
                TOTAL HITS: <span id="totalHitsCount">0</span>
            </div>

            <!-- Leaderboard -->


            <button id="restartGame"
                style="font-family: Cinzel, serif; font-size: 28px; font-weight: 700; letter-spacing: 0.2em; color: #14110e; background: var(--gold); border: none; padding: 24px 30px; min-height: 96px; cursor: pointer; width: 100%; border-radius: 4px; transition: transform 0.15s ease, box-shadow 0.15s ease;">START
                OVER</button>
        </div>
    </div>

    <div id="tweaks-root"></div>

    <script src="scripts/three.min.js"></script>

    <script src="scripts/messagebus.js"></script>
    <script src="scripts/game.js"></script>

</body>

</html>
